model = "gpt-6-astra"
model_reasoning_effort = "high"

# 使用 1M 上下文
model_context_window = 1050000

# 达到 90% 时自动压缩历史上下文
model_auto_compact_token_limit = 945000

# 按整个 active context 计算阈值
model_auto_compact_token_limit_scope = "total"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

developer_instructions = """
Use specialized subagents when delegation materially improves
quality, speed, independent verification, or context isolation.

Preferred workflow:

- Simple implementation:
  explorer -> worker

- Normal feature:
  explorer -> worker -> reviewer

- Complex feature or refactor:
  explorer -> planner -> worker -> reviewer

- Architecture-heavy task:
  explorer -> oracle -> planner -> worker -> reviewer

- Difficult debugging:
  explorer -> oracle -> worker -> reviewer

Do not invoke every agent for every task.

Prefer the least expensive capable agent:
- explorer for repository navigation
- worker for routine implementation
- planner for implementation planning
- oracle for difficult architecture and debugging
- reviewer for independent verification

Parallelize independent read-only work when useful.
Avoid concurrent edits to overlapping files.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

